name: Monthly Retrain

on:
  schedule:
    - cron: "0 3 1 * *"  # 1st of every month at 03:00 UTC
  workflow_dispatch:       # manual trigger from GitHub UI

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # scraping can take several hours

    env:
      MLFLOW_TRACKING_URI:      ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape fresh data
        run: python scraper.py --refresh-districts

      - name: Validate data
        run: python src/data/validate.py

      - name: Train model
        run: python -m src.models.train

      - name: Evaluate and promote
        run: python -m src.models.evaluate

      - name: Commit updated artefacts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/raw/otodom_all.csv \
            data/snapshots/ \
            data/districts_cache.json \
            model_artefacts/xgb_model.joblib \
            model_artefacts/target_enc_city.json \
            model_artefacts/target_enc_neighborhood.json \
            model_artefacts/city_neighborhoods.json \
            model_artefacts/meta.json \
            model_artefacts/production_meta.json \
            model_artefacts/candidate_meta.json
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: monthly retrain $(date +'%Y-%m')"
          git push
